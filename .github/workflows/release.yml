name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Cross-Platform Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Extract metadata
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME}"
          COMMIT="${GITHUB_SHA::8}"
          DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit=${COMMIT}" >> "$GITHUB_OUTPUT"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"

      - name: Build cross-platform binaries
        env:
          CGO_ENABLED: 0
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          DATE: ${{ steps.meta.outputs.date }}
        run: |
          mkdir -p dist
          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.Date=${DATE}"

          TARGETS=(
            "linux/amd64/golist-linux-amd64"
            "linux/arm64/golist-linux-arm64"
            "darwin/amd64/golist-darwin-amd64"
            "darwin/arm64/golist-darwin-arm64"
            "windows/amd64/golist-windows-amd64.exe"
            "windows/arm64/golist-windows-arm64.exe"
          )

          for target in "${TARGETS[@]}"; do
            IFS="/" read -r OS ARCH OUTPUT <<< "$target"
            echo "Building for ${OS}/${ARCH} -> dist/${OUTPUT}..."
            GOOS=$OS GOARCH=$ARCH go build -ldflags="$LDFLAGS" -o "dist/${OUTPUT}" .
          done

      - name: Package archives & checksums
        working-directory: dist
        run: |
          for bin in golist-linux-* golist-darwin-*; do
            tar -czvf "${bin}.tar.gz" "$bin"
          done
          for bin in golist-windows-*.exe; do
            zip "${bin%.exe}.zip" "$bin"
          done
          sha256sum *.tar.gz *.zip > checksums.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
          generate_release_notes: true
